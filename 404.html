<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Mewzaic</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="48x48" href="https://kaanguven.github.io/mewzaic-game/assets/favicon-48.png">
<style>:root {
  --bg-top: #3b2a92;
  --bg-bottom: #170f45;
  --edge: #6f60e6;
  --muted: #cfc9ff;
  --yellow: #ffd43b;
  --yellow-dark: #cf9300;
  --yellow-ink: #3b2800;
  --ink: #fff;
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  background: var(--bg-bottom) linear-gradient(180deg, var(--bg-top), var(--bg-bottom) 640px)
    no-repeat;
  font:
    1.0625rem/1.6 system-ui,
    -apple-system,
    'Segoe UI',
    Roboto,
    'Noto Sans',
    'Hiragino Sans',
    'Noto Sans CJK JP',
    'Malgun Gothic',
    sans-serif;
}

:lang(ko) {
  word-break: keep-all;
  overflow-wrap: anywhere;
}

:lang(ja) {
  word-break: auto-phrase;
  overflow-wrap: anywhere;
}

a {
  color: var(--yellow);
}

a:focus-visible,
[tabindex]:focus-visible {
  outline: 3px solid var(--yellow);
  outline-offset: 3px;
  border-radius: 6px;
}

.top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem 1.5rem;
  max-width: 60rem;
  margin: 0 auto;
  padding: 1rem 1.25rem;
}

.brand {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  color: var(--ink);
  font-size: 1.25rem;
  font-weight: 700;
  text-decoration: none;
}

.brand img {
  width: 3rem;
  height: 3rem;
  border-radius: 10px;
}

.langs ul {
  display: flex;
  flex-wrap: wrap;
  gap: 0.25rem 0.9rem;
  margin: 0;
  padding: 0;
  list-style: none;
  font-size: 0.9rem;
}

.langs a {
  color: var(--muted);
  text-decoration: none;
}

.langs a:hover {
  color: var(--ink);
  text-decoration: underline;
}

.langs a[aria-current] {
  color: var(--ink);
  font-weight: 700;
}

main {
  max-width: 60rem;
  margin: 0 auto;
  padding: 0 1.25rem 2rem;
}

.hero {
  padding: 1rem 0 1.5rem;
  text-align: center;
}

h1 {
  margin: 0.5rem 0;
  font-size: clamp(1.9rem, 6vw, 3rem);
  line-height: 1.15;
}

.lead {
  max-width: 36rem;
  margin: 0 auto 1.25rem;
  color: var(--muted);
  font-size: 1.2rem;
}

.cta {
  display: inline-block;
  margin: 0 0 1.5rem;
  padding: 0.8rem 1.6rem;
  border-radius: 999px;
  background: var(--yellow);
  box-shadow: 0 5px 0 var(--yellow-dark);
  color: var(--yellow-ink);
  font-weight: 700;
  text-decoration: none;
}

.cta-soon {
  background: transparent;
  box-shadow: inset 0 0 0 2px var(--yellow);
  color: var(--yellow);
}

.hero-art {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 1.25rem;
  box-shadow: 0 12px 32px rgb(0 0 0 / 35%);
}

.intro {
  max-width: 42rem;
  margin: 1.5rem auto;
  font-size: 1.2rem;
  text-align: center;
}

h2 {
  margin: 2.25rem 0 0.75rem;
  font-size: 1.5rem;
}

.points {
  margin: 0;
  padding-left: 1.25rem;
}

.points li {
  margin: 0.45rem 0;
}

.shots {
  overflow-x: auto;
  padding-bottom: 0.75rem;
  scroll-snap-type: x proximity;
}

.shots ul {
  display: flex;
  gap: 0.9rem;
  width: max-content;
  margin: 0;
  padding: 0;
  list-style: none;
}

.shots li {
  scroll-snap-align: start;
}

.shots img {
  display: block;
  width: min(55vw, 220px);
  height: auto;
  border-radius: 1rem;
  box-shadow: 0 8px 20px rgb(0 0 0 / 35%);
}

footer {
  max-width: 60rem;
  margin: 0 auto;
  padding: 1.5rem 1.25rem 2.5rem;
  border-top: 1px solid var(--edge);
  color: var(--muted);
  font-size: 0.9rem;
}

.legal {
  font-size: 0.8rem;
}

.missing {
  padding-top: 6rem;
  text-align: center;
}

@media (min-width: 700px) {
  .shots {
    overflow: visible;
  }

  .shots ul {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    width: auto;
  }

  .shots img {
    width: 100%;
  }
}

@media (prefers-reduced-motion: no-preference) {
  html {
    scroll-behavior: smooth;
  }
}
</style>
</head>
<body>
<main class="missing">
  <h1>Page not found</h1>
  <p><a class="cta" href="https://kaanguven.github.io/mewzaic-game/">Mewzaic</a></p>
</main>
</body>
</html>
